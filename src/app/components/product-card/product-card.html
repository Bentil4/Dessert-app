<article class="py-2 sm:py-4 cursor-pointer">
  @if (inCartQuantity() > 0) {
    <img
      ngOptimizedImage
      [src]="product().imageURL.desktop"
      [alt]="product().name"
      width="500"
      height="500"
      class="w-full h-auto rounded-lg border-2 border-red"
    />
  } @else {
    <img
      ngOptimizedImage
      [src]="product().imageURL.desktop"
      [alt]="product().name"
      width="500"
      height="500"
      class="w-full h-auto rounded-lg"
    />
  }

  <div
    class="flex items-center justify-center mt-3 sm:mt-3 relative -top-8 sm:-top-6 md:-top-8 left-14 w-3/5 rounded-full bg-white "
  >
    @if (inCartQuantity() > 0) {
      <div
        class="flex items-center justify-around  gap-2 sm:gap-4  px-2 sm:px-3 w-full h-14 bg-red text-white py-4 rounded-full"
      >
        <button
          type="button"
          class="focus-ring cursor-pointer border-2 border-white rounded-full p-1 hover:bg-white"
          aria-label="Decrease {{ product().name }} quantity"
          (click)="decrement.emit(product().name)"
        >
          <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" width="10" height="2" fill="none" viewBox="0 0 10 2"><path class="hover:fill-red" fill="#fff" d="M0 .375h10v1.25H0V.375Z"/></svg>
        </button>
        <span class="min-w-4 sm:min-w-6 text-center text-sm sm:text-base" aria-live="polite">{{ inCartQuantity() }}</span>
        <button
          type="button"
          class="focus-ring cursor-pointer border-2 border-white rounded-full p-1 hover:bg-white"
          aria-label="Increase {{ product().name }} quantity"
          (click)="increment.emit(product().name)"
        >
          <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10"><path class="hover:fill-red" fill="#fff" d="M10 4.375H5.625V0h-1.25v4.375H0v1.25h4.375V10h1.25V5.625H10v-1.25Z"/></svg>
        </button>
      </div>
    } @else {
      <button
        type="button"
        class="flex items-center justify-center gap-1 border-2 border-rose-400 rounded-full w-5/5 h-14 px-3 py-4 hover:text-red hover:border-red cursor-pointer"
        (click)="add.emit(product())"
        [attr.aria-label]="'Add ' + product().name + ' to cart'"
      >
        <img src="../../../assets/images/icon-add-to-cart.svg" alt="icon-add-to-cart" class="w-4 h-4 sm:w-5 sm:h-5" />
        <span class="text-xs sm:text-sm font-medium">Add to Cart</span>
      </button>
    }
  </div>

  <p class="mt-1 sm:mt-2 text-xs sm:text-sm text-rose-400">{{ product().category }}</p>
  <h3 class="font-semibold pt-1 text-sm sm:text-base">{{ product().name }}</h3>
  <p class="text-red font-bold pt-1 text-sm sm:text-base">{{ product().price | currency: 'GH₵' }}</p>
</article>
