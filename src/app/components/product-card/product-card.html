<article class="bg-white py-4 cursor-pointer">
  <img
    ngOptimizedImage
    [src]="product().imageURL.desktop"
    [alt]="product().name"
    width="500"
    height="500"
    class="rounded-lg"
  />
 

  <div
    class="flex items-center justify-center mt-3 relative -top-8 left-14 w-3/5 rounded-full bg-white py-2 text-black border-2 border-rose-400  hover:text-red hover:border-red"
  >
    @if (inCartQuantity() > 0) {
      <div class="inline-flex items-center gap-10 px-3 py-1.5 ">
        <button
          type="button"
          class="focus-ring cursor-pointer"
          aria-label="Decrease {{ product().name }} quantity"
          (click)="decrement.emit(product().name)"
        >
          −
        </button>
        <span class="min-w-6 text-center" aria-live="polite">{{ inCartQuantity() }}</span>
        <button
          type="button"
          class="focus-ring text-(--color-primary) cursor-pointer"
          aria-label="Increase {{ product().name }} quantity"
          (click)="increment.emit(product().name)"
        >
          ＋
        </button>
      </div>
    } @else {
      <button
        type="button"
        class="focus-ring inline-flex items-center gap-2 px-4 py-2 hover:border-(--color-primary) hover:text-(--color-primary) cursor-pointer"
        (click)="add.emit(product())"
        [attr.aria-label]="'Add ' + product().name + ' to cart'"
      >
        <img src="../../../assets/images/icon-add-to-cart.svg" alt="icon-add-to-cart" />
        <span class="text-sm font-medium">Add to Cart</span>
      </button>
    }
  </div>

  <p class="mt-2 text-sm text-gray-500">{{ product().category }}</p>
  <h3 class="font-semibold pt-1">{{ product().name }}</h3>
  <p class="text-red font-bold pt-1">{{ product().price | currency: 'GH₵' }}</p>
</article>
