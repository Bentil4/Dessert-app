@if (errorMessage$ | async; as errorMsg) {
  <div class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
    <p class="font-semibold">{{ errorMsg }}</p>
  </div>
}

<section class="mb-6 flex gap-4 items-center flex-wrap">
  <label class="flex items-center gap-2">
    <span class="font-semibold">Search:</span>
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Search desserts..."
      class="border rounded px-3 py-2 bg-white w-64"
    />
  </label>

  <label class="flex items-center gap-2">
    <span class="font-semibold">Category:</span>
    <select
      [(ngModel)]="selectedCategory"
      (ngModelChange)="onCategoryChange($event)"
      class="border rounded px-3 py-2 bg-white"
    >
      <option value="">All</option>
      <option value="Waffle">Waffle</option>
      <option value="Crème Brûlée">Crème Brûlée</option>
      <option value="Macaron">Macaron</option>
      <option value="Tiramisu">Tiramisu</option>
      <option value="Baklava">Baklava</option>
      <option value="Pie">Pie</option>
      <option value="Cake">Cake</option>
      <option value="Brownie">Brownie</option>
      <option value="Panna Cotta">Panna Cotta</option>
    </select>
  </label>
</section>

@if (productsWithCart$ | async; as products) {
  <section class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-3">
    @for (product of products; track product.name) {
      <app-product-card
        [product]="product"
        [inCartQuantity]="product.inCartQuantity"
        (add)="addToCart($event)"
        (increment)="incrementQuantity(product)"
        (decrement)="decrementQuantity(product)"
      />
    }
  </section>
} @else {
  <p>No desserts available.</p>
}
