<main class="w-full px-44 pt-10 bg-rose-50">
  <section class="flex gap-14">
    <section class="w-4/5">
      <h1 class="text-lgx font-black tracking-wider">Desserts</h1>
      <app-product-list></app-product-list>
    </section>
    <section class="w-1.5/5">
      <app-cart-panel (confirm)="onConfirmOrder()"></app-cart-panel>
    </section>
  </section>

  @if (isOrderConfirmed()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 overflow-y-auto" (click)="onCloseModal()">
    <app-order-confirm-model (click)="$event.stopPropagation()" (close)="onCloseModal()" />
  </div>
  }
</main>
